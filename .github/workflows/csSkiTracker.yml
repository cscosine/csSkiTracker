name: csSkiTracker
'on':
  push:
    branches:
    - main
    - dev
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 0 3 * * 1
jobs:
  release-from-artifacts:
    needs: orchestrator-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Repo Self Checkout
      uses: actions/checkout@v6
    - name: Clean Artifacts Folder
      run: rm -rf artifacts
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Show downloaded files
      run: find artifacts -type f
    - name: Manifest creation
      run: |-
        import os  # noqa: F401 keep even if locally unused, necessary with variable subst
        import sys
        from pathlib import Path
        from typing import cast

        from csorchestratorsdk.portable.release_manifest import (
            PublishPackageMode,  # noqa: F401 keep even if locally unused, necessary after variable subst
            ReposPublishConfigDict,
            collect_release_manifest_single_variant_and_prepare_manifest,
        )

        input_folder_base = Path('.')
        input_manifest_path_variant = [(Path('csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig/csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig'), (Path('csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig/csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig'), (Path('csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja/csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja'), (Path('csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja/csSkiTracker-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja'), (Path('csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig/csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig'), (Path('csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig/csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig'), (Path('csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja/csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja'), (Path('csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja/csSkiTracker-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja'), (Path('csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022/csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvc-default-msvc2022'), (Path('csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026/csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvc-default-msvc2026'), (Path('csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022/csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvcclang-default-msvc2022'), (Path('csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026/csSkiTracker-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvcclang-default-msvc2026')]
        output_manifest_filename = Path('csSkiTracker-0.1.0.csOrchestratorManifest')
        project_name = 'csSkiTracker'
        project_version = '0.1.0'
        base_path_additional_files = Path(os.environ["GITHUB_WORKSPACE"])
        list_additional_files = []
        output_folder_additional_files = Path('generated-for-release')
        output_bundle_file_name = Path('csSkiTracker-0.1.0-bundle.tar.gz')
        repo_publish_config_dict = {}
        header_only_variants_sources = {'csv1-linux': 'csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig', 'csv1-windows': 'csv1-windows-v10-x64-generic-msvc-default-msvc2022'}
        dependencies = {}
        dependencies_dev = {}

        errors_list = collect_release_manifest_single_variant_and_prepare_manifest(
            input_folder_base=input_folder_base,
            input_manifest_path_variant=input_manifest_path_variant,
            output_manifest_filename=output_manifest_filename,
            project_name=project_name,
            project_version=project_version,
            base_path_additional_files=base_path_additional_files,
            list_additional_files=list_additional_files,
            output_folder_additional_files=output_folder_additional_files,
            output_bundle_file_name=output_bundle_file_name,
            repo_publish_config_dict=repo_publish_config_dict,
            header_only_variants_sources=header_only_variants_sources,
            archive_files_are_in_context_based_folder=True,
            dependencies=dependencies,
            dependencies_dev=dependencies_dev,
        )

        if len(errors_list) > 0:
            for e in errors_list:
                print(e)
            sys.exit("ERROR: getting package versions")
      shell: python
      env:
        PYTHONPATH: ${{ github.workspace }}
      working-directory: artifacts
    - name: Upload manifest as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: csSkiTracker-0.1.0.csOrchestratorManifest
        path: |-
          artifacts/generated-for-release/csSkiTracker-0.1.0.csOrchestratorManifest
        overwrite: true
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |-
          artifacts/**/*.tar.gz
          artifacts/generated-for-release/csSkiTracker-0.1.0.csOrchestratorManifest
      if: ${{ github.ref_type == 'tag' }}
